[package]
name = "lwpdf-core"
version = "1.0.0"
edition = "2021"
license = "MIT"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
wasm-bindgen = "=0.2.105"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.release]
opt-level = "s"
lto = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
